apiVersion: v1
kind: ServiceAccount
metadata:
  name: msp-boinc-controller
  namespace: msp-boinc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: msp-boinc-controller
rules:
  - apiGroups: ["boinc.platform-mesh.io"]
    resources: ["boincworkloads", "boincworkloads/status", "boincprojects", "boincprojects/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: msp-boinc-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: msp-boinc-controller
subjects:
  - kind: ServiceAccount
    name: msp-boinc-controller
    namespace: msp-boinc
