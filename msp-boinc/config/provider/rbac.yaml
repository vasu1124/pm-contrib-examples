# config/provider/rbac.yaml — owner: kcp-expert
#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boinc-berkeley-edu-apiexport-bind
rules:
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports"]
    verbs: ["bind"]
    resourceNames: ["boinc.berkeley.edu"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boinc-berkeley-edu-anonymous-bind
subjects:
  - kind: User
    name: system:anonymous
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: boinc-berkeley-edu-apiexport-bind
  apiGroup: rbac.authorization.k8s.io
