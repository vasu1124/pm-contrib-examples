apiVersion: ui.platform-mesh.io/v1alpha1
kind: ProviderMetadata
metadata:
  name: boinc.platform-mesh.io
spec:
  displayName: BOINC Compute Provider
  description: |
    Submit Docker container workloads to BOINC volunteer computing networks.
    Provides BoincWorkload and BoincProject APIs for declarative batch job submission
    and status monitoring through kcp workspaces.
  contacts:
    - displayName: BOINC MSP Team
      email: boinc-msp@platform-mesh.io
      role: ["Maintainer"]
  preferredSupportChannels:
    - displayName: GitHub Issues
      url: https://github.com/platform-mesh/contrib-examples
  icon:
    light:
      data: "data:image/svg+xml;base64,"
    dark:
      data: "data:image/svg+xml;base64,"
