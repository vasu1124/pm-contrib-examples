# config/provider/providermetadata.yaml — owner: portal-expert
#
# ProviderMetadata applied into :root:providers:ironcore-provider on cluster A. Surfaces this
# provider in the default Platform Mesh portal's provider listing (icon, description, contacts,
# support channels). `metadata.name` MUST equal the APIExport name `ironcore.dev` — the
# portal joins ProviderMetadata <-> APIExport on that name.
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ProviderMetadata
metadata:
  name: ironcore.dev
spec:
  displayName: IronCore.dev
  description: |
    Self-service IronCore compute and networking resources, exposed through Platform Mesh.
    Order Machines, Networks, VirtualIPs, and NetworkInterfaces in your account workspace.
    Backed by ironcore-in-a-box — a local IronCore stack running in a kind cluster with
    libvirt-provider, dpservice, and the full ironcore-net overlay.
  contacts:
    - displayName: Platform Mesh Contrib Examples
      email: noreply@platform-mesh.io
      role: ["Maintainer"]
  preferredSupportChannels:
    - displayName: ironcore-dev (GitHub)
      url: https://github.com/ironcore-dev/ironcore-in-a-box
  icon:
    # Simple "IC" badge on IronCore-teal (#0D9488). Inline SVG -> base64.
    light:
      data: "data:image/svg+xml;base64,"
    dark:
      data: "data:image/svg+xml;base64,"
