# config/syncagent/rbac.yaml — owner: syncagent-expert
# Applied on the ironcore-in-a-box kind cluster. Grants the api-syncagent ServiceAccount the
# permissions it needs to reconcile the PUBLISHED ironcore resources on the service cluster.
#
# ServiceAccount: kcp-api-syncagent / namespace kcp-system  (created by the Helm chart; the
# release name `kcp-api-syncagent` equals the chart fullname, so SA name == release name).
#
# The chart's own ClusterRole (`kcp-api-syncagent:kcp-system`) already covers namespaces,
# customresourcedefinitions (CRD read → builds the APIResourceSchema), publishedresources, and
# secrets with get/list/watch/create/update. This role adds what is specific to THIS provider:
#   * compute.ironcore.dev — Machine CRs (machines + machines/status)
#   * networking.ironcore.dev — Network, VirtualIP, NetworkInterface CRs + /status
#   * core secrets — full verbs for synced secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcp-api-syncagent:ironcore
rules:
  - apiGroups: ["compute.ironcore.dev"]
    resources: ["machines", "machines/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.ironcore.dev"]
    resources:
      - "networks"
      - "networks/status"
      - "virtualips"
      - "virtualips/status"
      - "networkinterfaces"
      - "networkinterfaces/status"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcp-api-syncagent:ironcore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcp-api-syncagent:ironcore
subjects:
  - kind: ServiceAccount
    name: kcp-api-syncagent
    namespace: kcp-system
