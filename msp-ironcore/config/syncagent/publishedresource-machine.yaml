# config/syncagent/publishedresource-machine.yaml — owner: syncagent-expert
# Applied on the ironcore-in-a-box kind cluster. Tells the api-syncagent to publish IronCore's
# Machine API into kcp — the agent generates an APIResourceSchema from the CRD and adds it to
# the APIExport `ironcore.dev` in the provider workspace.
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: ironcore-machines
spec:
  resource:
    apiGroup: compute.ironcore.dev
    kind: Machine
    versions:
      - v1alpha1
  related:
    - # unique name for this related resource. The name must be unique within
      # one PublishedResource and is the key by which consumers (end users)
      # can identify and consume the related resource. Common names are
      # "connection-details" or "credentials".
      identifier: ignition
      # "service" or "kcp"
      origin: kcp
      # the GVR of the related resource
      group: ""
      version: v1
      resource: secrets

      # configure where in the parent object we can find the child object
      object:
        # Object can use either reference, labelSelector or template. In this
        # example we use references.
        reference:
          # This path is evaluated in both the local and remote objects, to figure out
          # the local and remote names for the related object. This saves us from having
          # to remember mutated fields before their mutation (similar to the last-known
          # annotation).
          path: spec.ignitionRef.name
  # !! GOAL-1 SINGLE-CONSUMER SIMPLIFICATION — MUST BE REMOVED FOR GOAL 2 !!
  # This `naming` block preserves the consumer's name + namespace on the service cluster instead of
  # the agent's DEFAULT anti-collision hashing. It makes the on-kind objects predictable — Cluster
  # `pg-demo` in ns `default`, pods `pg-demo-N`, Secret `pg-demo-app` — matching docs/architecture.md
  # and the CNPG live-test Job in config/cnpg/NOTES.md.
  # It is SAFE ONLY because goal 1 is single-consumer / single-order. For the multi-consumer goal 2,
  # DELETE this entire `naming` block to restore the default hashing — otherwise two consumers that
  # order the same name/namespace would COLLIDE on kind (the default hashing exists precisely to
  # prevent that). The kcp-side synced Secret is `pg-demo-app` with or without this block.
  naming:
    name: "{{ .Object.metadata.name }}"
    namespace: "{{ .Object.metadata.namespace }}"