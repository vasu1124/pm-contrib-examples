# config/samples/order-machine.yaml — owner: ironcore-expert
# Consumer-facing ironcore resources applied into the kcp consumer (account) workspace in cluster A.
# api-syncagent (in the ironcore-in-a-box cluster) syncs these DOWN to kind where the IronCore
# controllers provision the resources, then syncs status back UP to the consumer workspace.
#
# This creates a complete VM setup:
#   - A Machine with a root disk and network interface
#   - A Network for the overlay
#   - A VirtualIP for public access
#   - A NetworkInterface linking the machine to the network with the VirtualIP
#   - An ignition Secret for VM bootstrap configuration
---
apiVersion: compute.ironcore.dev/v1alpha1
kind: Machine
metadata:
  name: webapp
  namespace: default
spec:
  volumes:
    - name: rootdisk
      localDisk:
        image: ghcr.io/ironcore-dev/gardenlinux/gardener:2150.4.0-kvm
  networkInterfaces:
    - name: default
      networkInterfaceRef:
        name: webapp
  machineClassRef:
    name: t3-small
  ignitionRef:
    name: ignition
---
apiVersion: networking.ironcore.dev/v1alpha1
kind: Network
metadata:
  name: webapp
  namespace: default
---
apiVersion: networking.ironcore.dev/v1alpha1
kind: VirtualIP
metadata:
  name: webapp
  namespace: default
spec:
  ipFamily: IPv4
  type: Public
---
apiVersion: networking.ironcore.dev/v1alpha1
kind: NetworkInterface
metadata:
  name: webapp
  namespace: default
spec:
  networkRef:
    name: webapp
  ipFamilies:
    - IPv4
  ips:
    - value: 10.0.0.1
  virtualIP:
    virtualIPRef:
      name: webapp
---
apiVersion: v1
kind: Secret
metadata:
  name: ignition
  namespace: default
data:
  ignition.yaml: 
